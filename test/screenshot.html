<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docker Card — screenshot renderer</title>
<style>
  /* Page canvas matches GitHub's so the screenshots sit flush in the README. */
  :root { --page-background: #f6f8fa; }
  body.dark { --page-background: #0d1117; }

  /* Home Assistant theme variables. --state-active-color is deliberately left
     undefined, as many themes leave it, so the card falls back to its own accents. */
  .pane {
    --primary-color: #03a9f4;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --text-primary-color: #ffffff;
    --divider-color: rgba(0, 0, 0, .12);
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --ha-card-border-radius: 12px;
    --info-color: #039be5;
    background: #f6f8fa;
  }
  .pane.dark {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: rgba(255, 255, 255, .12);
    --card-background-color: #1c1c1c;
    --ha-card-background: #1c1c1c;
    background: #0d1117;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-background);
    font-family: Roboto, "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { padding: 24px; display: grid; gap: 16px; width: max-content; }
  #stage.two-up { grid-template-columns: 1fr 1fr; align-items: start; }
  #stage.three-up { grid-template-columns: repeat(3, max-content); align-items: start; }
  .pane { display: grid; gap: 16px; align-content: start; padding: 20px; border-radius: 14px; }
  .pane > .label {
    font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em; text-transform: uppercase; opacity: .55;
    color: var(--primary-text-color);
  }
</style>
</head>

    "sensor.immich_db_state": mk("sensor.immich_db_state", "restarting"),
    "switch.immich_db": mk("switch.immich_db", "on"),
    "sensor.hass_state": mk("sensor.hass_state", "running"),
    "switch.hass": mk("switch.hass", "on"),
    "button.hass_restart": mk("button.hass_restart", "2026-08-22T09:00:00+00:00"),
    "sensor.hass_health": mk("sensor.hass_health", "healthy"),
    "sensor.hass_image": mk("sensor.hass_image", "ghcr.io/home-assistant:2026.8", { friendly_name: "Home Assistant Image" })
  };

  var HASS = {
    states: STATES,
    language: "en",
    callService: function () { return Promise.resolve(); }
  };

  var OVERVIEW = {
    container_count: "sensor.docker_containers_total",
    containers_running: "sensor.docker_containers_running",
    containers_stopped: "sensor.docker_containers_stopped",
    image_count: "sensor.docker_images",
    docker_version: "sensor.docker_version",
    operating_system: "sensor.host_os",
    operating_system_version: "sensor.host_os_version",
    status: "binary_sensor.docker_status"
  };

  var HA_FULL = {
    name: "Home Assistant", icon: "mdi:home-assistant",
    status_entity: "sensor.homeassistant_state", control_entity: "switch.homeassistant",
    restart_entity: "button.homeassistant_restart", pause_entity: "button.homeassistant_pause",
    kill_entity: "button.homeassistant_kill", recreate_entity: "button.homeassistant_recreate",
    update_entity: "update.homeassistant_image", health_entity: "sensor.homeassistant_health",
    cpu_entity: "sensor.homeassistant_cpu", memory_entity: "sensor.homeassistant_memory"
  };
  var Z2M = {
    name: "Zigbee2MQTT", icon: "mdi:zigbee",
    status_entity: "sensor.zigbee2mqtt_state", control_entity: "switch.zigbee2mqtt",
    restart_entity: "button.zigbee2mqtt_restart", health_entity: "sensor.zigbee2mqtt_health",
    cpu_entity: "sensor.zigbee2mqtt_cpu", memory_entity: "sensor.zigbee2mqtt_memory"
  };
  var FRIGATE = {
    name: "Frigate", icon: "mdi:cctv",
    status_entity: "sensor.frigate_state", control_entity: "switch.frigate",
    restart_entity: "button.frigate_restart", resume_entity: "button.frigate_resume",
    kill_entity: "button.frigate_kill",
    cpu_entity: "sensor.frigate_cpu", memory_entity: "sensor.frigate_memory"
  };
  var NODERED = {
    name: "Node-RED", icon: "mdi:sitemap",
    status_entity: "sensor.nodered_state", control_entity: "switch.nodered",
    restart_entity: "button.nodered_restart",
    cpu_entity: "sensor.nodered_cpu", memory_entity: "sensor.nodered_memory"
  };

  var CASES = {
    hero: {
      width: 452, threeUp: true,
      menus: [{ card: 0, row: 0 }, { card: 1, header: true }],
      configs: [
        {
          type: "custom:docker-card", title: "CoreNet Docker", containers_expanded: true, show_icons: true,
          docker_overview: {
            status: "binary_sensor.corenet_status", container_count: "sensor.corenet_total",
            containers_running: "sensor.corenet_running", image_count: "sensor.corenet_images",
            docker_version: "sensor.corenet_version", operating_system: "sensor.corenet_os",
            operating_system_version: "sensor.corenet_os_version"
          },
          containers: [
            { name: "AdGuard Home", icon: "mdi:shield-check", status_entity: "sensor.adguard_state",
              control_entity: "switch.adguard", restart_entity: "button.adguard_restart",
              pause_entity: "button.adguard_pause", kill_entity: "button.adguard_kill",
              recreate_entity: "button.adguard_recreate", update_entity: "update.adguard_image",
              health_entity: "sensor.adguard_health",
              cpu_entity: "sensor.adguard_cpu", memory_entity: "sensor.adguard_memory" },
            { name: "Nginx Proxy Manager", icon: "mdi:web", status_entity: "sensor.npm_state",
              control_entity: "switch.npm", restart_entity: "button.npm_restart",
              cpu_entity: "sensor.npm_cpu", memory_entity: "sensor.npm_memory" },
            { name: "Vaultwarden", icon: "mdi:shield-key", status_entity: "sensor.vaultwarden_state",
              control_entity: "switch.vaultwarden", restart_entity: "button.vaultwarden_restart",
              health_entity: "sensor.vaultwarden_health" },
            { name: "Uptime Kuma", icon: "mdi:heart-pulse", status_entity: "sensor.uptime_state",
              control_entity: "switch.uptime", restart_entity: "button.uptime_restart" }
          ]
        },
        {
          type: "custom:docker-card", title: "MediaBox Docker", containers_expanded: true, show_icons: true,
          docker_overview: {
            status: "binary_sensor.mediabox_status", container_count: "sensor.mediabox_total",
            containers_running: "sensor.mediabox_running", image_count: "sensor.mediabox_images",
            docker_version: "sensor.mediabox_version", operating_system: "sensor.mediabox_os",
            operating_system_version: "sensor.mediabox_os_version",
            prune_images: "button.mediabox_prune_images", prune_volumes: "button.mediabox_prune_volumes"
          },
          containers: [
            { name: "Jellyfin", icon: "mdi:play-circle", status_entity: "sensor.jellyfin_state2",
              control_entity: "switch.jellyfin2", restart_entity: "button.jellyfin2_restart",
              update_entity: "update.jellyfin2_image",
              cpu_entity: "sensor.jellyfin2_cpu", memory_entity: "sensor.jellyfin2_memory" },
            { name: "qBittorrent", icon: "mdi:download", status_entity: "sensor.qbit_state",
              control_entity: "switch.qbit", restart_entity: "button.qbit_restart",
              cpu_entity: "sensor.qbit_cpu", memory_entity: "sensor.qbit_memory" },
            { name: "FileBrowser", icon: "mdi:folder-multiple", status_entity: "sensor.filebrowser_state",
              control_entity: "switch.filebrowser", restart_entity: "button.filebrowser_restart",
              resume_entity: "button.filebrowser_resume" },
            { name: "Sonarr", icon: "mdi:television-classic", status_entity: "sensor.sonarr_state2",
              control_entity: "switch.sonarr2", restart_entity: "button.sonarr2_restart",
              cpu_entity: "sensor.npm_cpu", memory_entity: "sensor.npm_memory" }
          ]
        },
        {
          type: "custom:docker-card", title: "HomeLab Docker", containers_expanded: true, show_icons: true,
          group_by: "stack",
          stacks: { immich: { control_entity: "switch.immich_stack" } },
          docker_overview: {
            status: "binary_sensor.homelab_status", container_count: "sensor.homelab_total",
            containers_running: "sensor.homelab_running", image_count: "sensor.homelab_images",
            docker_version: "sensor.homelab_version", operating_system: "sensor.homelab_os",
            operating_system_version: "sensor.homelab_os_version"
          },
          containers: [
            { name: "Immich Server", icon: "mdi:image-multiple", stack: "immich",
              status_entity: "sensor.immich_server_state", control_entity: "switch.immich_server",
              restart_entity: "button.immich_server_restart",
              cpu_entity: "sensor.immich_server_cpu", memory_entity: "sensor.immich_server_memory" },
            { name: "Immich ML", icon: "mdi:brain", stack: "immich",
              status_entity: "sensor.immich_ml_state", control_entity: "switch.immich_ml",
              restart_entity: "button.immich_ml_restart" },
            { name: "Immich Postgres", icon: "mdi:database", stack: "immich",
              status_entity: "sensor.immich_db_state", control_entity: "switch.immich_db" },
            { name: "Home Assistant", icon: "mdi:home-assistant",
              status_entity: "sensor.hass_state", control_entity: "switch.hass",
              restart_entity: "button.hass_restart", health_entity: "sensor.hass_health" }
          ]
        }
      ]
    },
    themes: {
      width: 420, twoUp: true,
      panes: ["light", "dark"],
      config: {
        type: "custom:docker-card", title: "Docker @ homelab",
        containers_expanded: true, show_icons: true, docker_overview: OVERVIEW,
        containers: [HA_FULL, Z2M, NODERED]
      }
    },
    actions: {
      width: 520, panes: ["light"], openMenu: 2,
      config: {
        type: "custom:docker-card", title: "Container actions",
        containers_expanded: true, show_icons: true,
        docker_overview: { status: "binary_sensor.docker_status" },
        containers: [Z2M, NODERED, HA_FULL, FRIGATE]
      }
    },
    resources: {
      width: 480, panes: ["light"],
      config: {
        type: "custom:docker-card", title: "CPU, memory and extra entities",
        containers_expanded: true, show_icons: true,
        containers: [
          Object.assign({}, HA_FULL, {
            extra_entities: [
              "sensor.homeassistant_image",
              { entity: "sensor.homeassistant_health", icon: "mdi:heart-pulse" }
            ]
          }),
          Z2M, NODERED
        ]
      }
    },
    states: {
      width: 480, panes: ["light"],
      config: {
        type: "custom:docker-card", title: "Container states",
        containers_expanded: true, show_icons: true,
        containers: [
          Z2M,
          { name: "Frigate", icon: "mdi:cctv", status_entity: "sensor.frigate_state", control_entity: "switch.frigate", resume_entity: "button.frigate_resume" },
          { name: "Paperless", icon: "mdi:file-document", status_entity: "sensor.paperless_state", control_entity: "switch.paperless" },
          NODERED
        ]
      }
    },
    stacks: {
      width: 520, panes: ["light"],
      config: {
        type: "custom:docker-card", title: "Grouped by stack",
        containers_expanded: true, show_icons: true, group_by: "stack",
        stacks: { media: { control_entity: "switch.media_stack" } },
        docker_overview: { status: "binary_sensor.docker_status" },
        containers: [
          { name: "Jellyfin", icon: "mdi:play-circle", stack: "media", status_entity: "sensor.jellyfin_state", control_entity: "switch.jellyfin", restart_entity: "button.jellyfin_restart", cpu_entity: "sensor.jellyfin_cpu", memory_entity: "sensor.jellyfin_memory" },
          { name: "Sonarr", icon: "mdi:television-classic", stack: "media", status_entity: "sensor.sonarr_state", control_entity: "switch.sonarr", restart_entity: "button.sonarr_restart" },
          { name: "Radarr", icon: "mdi:movie-open", stack: "media", status_entity: "sensor.radarr_state", control_entity: "switch.radarr" },
          Object.assign({}, HA_FULL, { update_entity: undefined }),
          Z2M
        ]
      }
    },
    overview: {
      width: 520, panes: ["light"],
      configs: [
        { type: "custom:docker-card", title: "Docker @ homelab", show_containers: false, docker_overview: OVERVIEW },
        { type: "custom:docker-card", title: "Collapsed by default", containers_expanded: false, show_icons: true, docker_overview: OVERVIEW, containers: [HA_FULL, Z2M, NODERED] }
      ]
    }
  };

  var params = new URLSearchParams(location.search);
  var name = params.get("case") || "hero";
  var theme = params.get("theme") === "dark" ? "dark" : "light";
  var spec = CASES[name];
  var stage = document.getElementById("stage");
  if (spec.twoUp) stage.classList.add("two-up");
  if (spec.threeUp) stage.classList.add("three-up");
  document.body.classList.add(theme);
  /* single-pane cases follow the requested theme; the two-up comparison keeps
     one pane of each and only its canvas follows the theme */
  var panes = spec.twoUp ? spec.panes : [theme];

  var clone = function (v) { return JSON.parse(JSON.stringify(v)); };
  var cards = [];

  var multi = (spec.configs || []).length > 1 && (spec.twoUp || spec.threeUp);
  panes.forEach(function (paneTheme) {
    var pane = document.createElement("div");
    pane.className = "pane " + paneTheme;
    pane.style.width = spec.width + "px";
    if (spec.twoUp) {
      var label = document.createElement("div");
      label.className = "label";
      label.textContent = paneTheme + " theme";
      pane.appendChild(label);
    }
    if (multi) {
      /* one card per pane so the three sit side by side */
      spec.configs.forEach(function (cfg, i) {
        var col = document.createElement("div");
        col.className = "pane " + paneTheme;
        col.style.width = spec.width + "px";
        var el = document.createElement("docker-card");
        el.setConfig(clone(cfg));
        col.appendChild(el);
        el.hass = HASS;
        cards.push(el);
        stage.appendChild(col);
      });
      return;
    }
    (spec.configs || [spec.config]).forEach(function (cfg) {
      var el = document.createElement("docker-card");
      el.setConfig(clone(cfg));
      pane.appendChild(el);
      el.hass = HASS;
      cards.push(el);
    });
    stage.appendChild(pane);
  });

  /* openMenu is a row index inside the first card */
  if (typeof spec.openMenu === "number") {
    var rows = cards[0].shadowRoot.querySelectorAll(".container-row");
    var row = rows[spec.openMenu];
    var trigger = row && row.querySelector(".overflow-trigger");
    if (trigger) trigger.click();
  }

  /* Several menus at once: drive the card directly rather than clicking, or the
     click that opens the second menu closes the first. */
  (spec.menus || []).forEach(function (want) {
    var card = cards[want.card];
    if (!card) return;
    var key;
    if (want.header) {
      key = "__host__";
    } else {
      var rowEl = card.shadowRoot.querySelectorAll(".container-row")[want.row];
      key = rowEl && rowEl.dataset.containerKey;
    }
    if (!key) return;
    card._openMenu(key);
    card.render();
  });

  /* Stamped synchronously as well as on a timer: a hidden tab never runs
     requestAnimationFrame, and the capture script reads these attributes. */
  var stamp = function () {
    var box = stage.getBoundingClientRect();
    document.body.dataset.w = String(Math.ceil(box.width));
    document.body.dataset.h = String(Math.ceil(box.height));
    document.title = "ready";
  };
  stamp();
  setTimeout(stamp, 100);
})();
</script>
</body>
</html>
