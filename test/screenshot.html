<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docker Card — screenshot renderer</title>
<style>
  /* Page canvas matches GitHub's so the screenshots sit flush in the README. */
  :root { --page-background: #f6f8fa; }
  body.dark { --page-background: #0d1117; }

  /* Home Assistant theme variables. --state-active-color is deliberately left
     undefined, as many themes leave it, so the card falls back to its own accents. */
  .pane {
    --primary-color: #03a9f4;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --text-primary-color: #ffffff;
    --divider-color: rgba(0, 0, 0, .12);
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --ha-card-border-radius: 12px;
    --info-color: #039be5;
    background: #f6f8fa;
  }
  .pane.dark {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: rgba(255, 255, 255, .12);
    --card-background-color: #1c1c1c;
    --ha-card-background: #1c1c1c;
    background: #0d1117;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-background);
    font-family: Roboto, "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { padding: 24px; display: grid; gap: 16px; width: max-content; }
  #stage.two-up { grid-template-columns: 1fr 1fr; align-items: start; }
  .pane { display: grid; gap: 16px; align-content: start; padding: 20px; border-radius: 14px; }
  .pane > .label {
    font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em; text-transform: uppercase; opacity: .55;
    color: var(--primary-text-color);
  }
</style>
</head>

        '<style>:host{fill:currentcolor}' +
        '.wrap{display:var(--ha-icon-display,inline-flex);align-items:center;justify-content:center;' +
        'position:relative;vertical-align:middle;fill:currentcolor;' +
        'width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}' +
        'svg{width:100%;height:100%;fill:currentColor}</style>' +
        '<span class="wrap"><svg viewBox="0 0 24 24"><title>' + name + '</title>' + body + '</svg></span>';
    }
  }
  customElements.define("ha-icon", HaIcon);
})();
</script>

    "sensor.sonarr_state": mk("sensor.sonarr_state", "running"),
    "switch.sonarr": mk("switch.sonarr", "on"),
    "button.sonarr_restart": mk("button.sonarr_restart", "2026-08-21T10:00:00+00:00"),
    "sensor.radarr_state": mk("sensor.radarr_state", "exited"),
    "switch.radarr": mk("switch.radarr", "off"),
    "switch.media_stack": mk("switch.media_stack", "on")
  };

  var HASS = {
    states: STATES,
    language: "en",
    callService: function () { return Promise.resolve(); }
  };

  var OVERVIEW = {
    container_count: "sensor.docker_containers_total",
    containers_running: "sensor.docker_containers_running",
    containers_stopped: "sensor.docker_containers_stopped",
    image_count: "sensor.docker_images",
    docker_version: "sensor.docker_version",
    operating_system: "sensor.host_os",
    operating_system_version: "sensor.host_os_version",
    status: "binary_sensor.docker_status"
  };

  var HA_FULL = {
    name: "Home Assistant", icon: "mdi:home-assistant",
    status_entity: "sensor.homeassistant_state", control_entity: "switch.homeassistant",
    restart_entity: "button.homeassistant_restart", pause_entity: "button.homeassistant_pause",
    kill_entity: "button.homeassistant_kill", recreate_entity: "button.homeassistant_recreate",
    update_entity: "update.homeassistant_image", health_entity: "sensor.homeassistant_health",
    cpu_entity: "sensor.homeassistant_cpu", memory_entity: "sensor.homeassistant_memory"
  };
  var Z2M = {
    name: "Zigbee2MQTT", icon: "mdi:zigbee",
    status_entity: "sensor.zigbee2mqtt_state", control_entity: "switch.zigbee2mqtt",
    restart_entity: "button.zigbee2mqtt_restart", health_entity: "sensor.zigbee2mqtt_health",
    cpu_entity: "sensor.zigbee2mqtt_cpu", memory_entity: "sensor.zigbee2mqtt_memory"
  };
  var FRIGATE = {
    name: "Frigate", icon: "mdi:cctv",
    status_entity: "sensor.frigate_state", control_entity: "switch.frigate",

  var NODERED = {
    name: "Node-RED", icon: "mdi:sitemap",
    status_entity: "sensor.nodered_state", control_entity: "switch.nodered",
    restart_entity: "button.nodered_restart",
    cpu_entity: "sensor.nodered_cpu", memory_entity: "sensor.nodered_memory"
  };

  var CASES = {
    hero: {
      width: 520,
      panes: ["light"],
      config: {
        type: "custom:docker-card", title: "Docker @ homelab",
        containers_expanded: true, show_icons: true, docker_overview: OVERVIEW,
        containers: [HA_FULL, Z2M, FRIGATE, NODERED]
      }
    },
    themes: {
      width: 420, twoUp: true,
      panes: ["light", "dark"],
      config: {
        type: "custom:docker-card", title: "Docker @ homelab",
        containers_expanded: true, show_icons: true, docker_overview: OVERVIEW,
        containers: [HA_FULL, Z2M, NODERED]
      }
    },
    actions: {
      width: 520, panes: ["light"], openMenu: 2,
      config: {
        type: "custom:docker-card", title: "Container actions",
        containers_expanded: true, show_icons: true,
        docker_overview: { status: "binary_sensor.docker_status" },
        containers: [Z2M, NODERED, HA_FULL, FRIGATE]
      }
    },
    resources: {
      width: 480, panes: ["light"],
      config: {
        type: "custom:docker-card", title: "CPU, memory and extra entities",
        containers_expanded: true, show_icons: true,
        containers: [
          Object.assign({}, HA_FULL, {
            extra_entities: [
              "sensor.homeassistant_image",
              { entity: "sensor.homeassistant_health", icon: "mdi:heart-pulse" }
            ]
          }),
          Z2M, NODERED
        ]
      }
    },
    states: {
      width: 480, panes: ["light"],
      config: {
        type: "custom:docker-card", title: "Container states",
        containers_expanded: true, show_icons: true,
        containers: [
          Z2M,
          { name: "Frigate", icon: "mdi:cctv", status_entity: "sensor.frigate_state", control_entity: "switch.frigate", resume_entity: "button.frigate_resume" },
          { name: "Paperless", icon: "mdi:file-document", status_entity: "sensor.paperless_state", control_entity: "switch.paperless" },
          NODERED
        ]
      }
    },
    stacks: {
      width: 520, panes: ["light"],
      config: {
        type: "custom:docker-card", title: "Grouped by stack",
        containers_expanded: true, show_icons: true, group_by: "stack",
        stacks: { media: { control_entity: "switch.media_stack" } },
        docker_overview: { status: "binary_sensor.docker_status" },
        containers: [
          { name: "Jellyfin", icon: "mdi:play-circle", stack: "media", status_entity: "sensor.jellyfin_state", control_entity: "switch.jellyfin", restart_entity: "button.jellyfin_restart", cpu_entity: "sensor.jellyfin_cpu", memory_entity: "sensor.jellyfin_memory" },

      ]
    }
  };

  var params = new URLSearchParams(location.search);
  var name = params.get("case") || "hero";
  var theme = params.get("theme") === "dark" ? "dark" : "light";
  var spec = CASES[name];
  var stage = document.getElementById("stage");
  if (spec.twoUp) stage.classList.add("two-up");
  document.body.classList.add(theme);
  /* single-pane cases follow the requested theme; the two-up comparison keeps
     one pane of each and only its canvas follows the theme */
  var panes = spec.twoUp ? spec.panes : [theme];

  var clone = function (v) { return JSON.parse(JSON.stringify(v)); };
  var cards = [];

  panes.forEach(function (paneTheme) {
    var pane = document.createElement("div");
    pane.className = "pane " + paneTheme;
    pane.style.width = spec.width + "px";
    if (spec.twoUp) {
      var label = document.createElement("div");
      label.className = "label";
      label.textContent = paneTheme + " theme";
      pane.appendChild(label);
    }
    (spec.configs || [spec.config]).forEach(function (cfg) {
      var el = document.createElement("docker-card");
      el.setConfig(clone(cfg));
      pane.appendChild(el);
      el.hass = HASS;
      cards.push(el);
    });
    stage.appendChild(pane);
  });

  /* openMenu is a row index inside the first card */
  if (typeof spec.openMenu === "number") {
    var rows = cards[0].shadowRoot.querySelectorAll(".container-row");
    var row = rows[spec.openMenu];
    var trigger = row && row.querySelector(".overflow-trigger");
    if (trigger) trigger.click();
  }

  requestAnimationFrame(function () {
    var box = stage.getBoundingClientRect();
    document.body.dataset.w = String(Math.ceil(box.width));
    document.body.dataset.h = String(Math.ceil(box.height));
    document.title = "ready";
  });
})();
